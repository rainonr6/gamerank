name: Build GameRank apps

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  API_URL: ${{ vars.GAMERANK_API_URL }}

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: unzip -q gamerank.zip && cp -a gamerank/. .
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node server/test.js

  android:
    needs: server-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: unzip -q gamerank.zip && cp -a gamerank/. .
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Point the app at your server
        run: |
          if [ -n "$API_URL" ]; then
            printf "window.GAMERANK_CONFIG = { apiUrl: '%s' };\n" "$API_URL" > web/config.js
          fi
      - run: npm install --no-audit --no-fund
      - name: Create Android project
        run: |
          npx cap add android
          node scripts/patch-android.mjs
      - name: Generate app icons
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0b0b0b' --splashBackgroundColor '#0b0b0b'
      - run: npx cap sync android
      - run: node scripts/patch-android.mjs
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: GameRank-android-apk
          path: android/app/build/outputs/apk/debug/*.apk

  desktop:
    needs: server-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, script: 'desktop:win', name: windows, glob: 'dist/*.exe' }
          - { os: ubuntu-latest, script: 'desktop:linux', name: linux, glob: 'dist/*.AppImage' }
          - { os: macos-latest, script: 'desktop:mac', name: macos, glob: 'dist/*.dmg' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        if: runner.os != 'Windows'
        run: unzip -q gamerank.zip && cp -a gamerank/. .
      - name: Unpack project (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive -Path gamerank.zip -DestinationPath . -Force
          Copy-Item -Path gamerank\* -Destination . -Recurse -Force
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Point the app at your server
        shell: bash
        run: |
          if [ -n "$API_URL" ]; then
            printf "window.GAMERANK_CONFIG = { apiUrl: '%s' };\n" "$API_URL" > web/config.js
          fi
      - run: npm install --no-audit --no-fund
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: GameRank-${{ matrix.name }}
          path: ${{ matrix.glob }}
